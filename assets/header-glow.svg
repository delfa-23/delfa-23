<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF006E">
        <animate attributeName="stop-color" values="#FF006E;#8338EC;#00F5FF;#FF006E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8338EC">
        <animate attributeName="stop-color" values="#8338EC;#00F5FF;#FF006E;#8338EC" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#FF006E;#8338EC;#00F5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#0a0a12"/>

  <!-- background scanlines / grid for depth -->
  <g opacity="0.08">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00F5FF" stroke-width="1"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00F5FF" stroke-width="1"/>
    <line x1="0" y1="140" x2="900" y2="140" stroke="#00F5FF" stroke-width="1"/>
    <line x1="0" y1="180" x2="900" y2="180" stroke="#00F5FF" stroke-width="1"/>
  </g>

  <!-- floating glow orbs -->
  <circle cx="80" cy="50" r="3" fill="#FF006E" filter="url(#softGlow)">
    <animate attributeName="cy" values="50;170;50" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="180" r="3" fill="#00F5FF" filter="url(#softGlow)">
    <animate attributeName="cy" values="180;40;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="60" r="2.5" fill="#8338EC" filter="url(#softGlow)">
    <animate attributeName="cx" values="750;700;750" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- main glowing title -->
  <text x="450" y="105" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="42" font-weight="700"
        text-anchor="middle" fill="url(#neonGrad)" filter="url(#glow)">
    MUHAMMAD DELFA TAMERAWAN
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- subtitle -->
  <text x="450" y="145" font-family="'Segoe UI', monospace" font-size="18" letter-spacing="2"
        text-anchor="middle" fill="#c9d1d9" opacity="0.85">
    FULL-STACK &amp; MOBILE DEVELOPER — INDONESIA
  </text>

  <!-- animated underline -->
  <rect x="250" y="165" width="0" height="3" rx="1.5" fill="url(#neonGrad)" filter="url(#glow)">
    <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.3;0.7;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="250;250;450;450" keyTimes="0;0.3;0.7;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
