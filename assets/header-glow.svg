<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rgbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF006E">
        <animate attributeName="stop-color" values="#FF006E;#8338EC;#00F5FF;#39FF14;#FF006E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8338EC">
        <animate attributeName="stop-color" values="#8338EC;#00F5FF;#39FF14;#FF006E;#8338EC" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#39FF14;#FF006E;#8338EC;#00F5FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="42" height="72.7" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M21 0 L42 12 L42 36 L21 48 L0 36 L0 12 Z" fill="none" stroke="#8338EC" stroke-width="0.6" opacity="0.25"/>
      <path d="M21 24 L42 36 L42 60 L21 72 L0 60 L0 36 Z" fill="none" stroke="#00F5FF" stroke-width="0.6" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="#05050a"/>
  <rect width="900" height="240" fill="url(#hex)"/>

  <!-- HUD corner brackets -->
  <g stroke="url(#rgbGrad)" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M20 20 L20 55 M20 20 L55 20"/>
    <path d="M880 20 L880 55 M880 20 L845 20"/>
    <path d="M20 220 L20 185 M20 220 L55 220"/>
    <path d="M880 220 L880 185 M880 220 L845 220"/>
  </g>

  <!-- status pill -->
  <g transform="translate(30,35)">
    <circle cx="0" cy="0" r="5" fill="#39FF14" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2" fill="#39FF14">ONLINE</text>
  </g>

  <!-- level badge -->
  <g transform="translate(770,25)">
    <rect x="0" y="0" width="105" height="24" rx="3" fill="none" stroke="#FF006E" stroke-width="1.2" filter="url(#glow)"/>
    <text x="52" y="16" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1" fill="#FF006E" text-anchor="middle">LVL 99 · DEV</text>
  </g>

  <!-- glitch layers of name -->
  <text x="452" y="120" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="40" font-weight="800"
        text-anchor="middle" fill="#FF006E" opacity="0.5">
    MUHAMMAD DELFA TAMERAWAN
    <animate attributeName="x" values="452;448;452" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="448" y="118" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="40" font-weight="800"
        text-anchor="middle" fill="#00F5FF" opacity="0.5">
    MUHAMMAD DELFA TAMERAWAN
    <animate attributeName="x" values="448;452;448" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="119" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="40" font-weight="800"
        text-anchor="middle" fill="url(#rgbGrad)" filter="url(#glow)">
    MUHAMMAD DELFA TAMERAWAN
  </text>

  <text x="450" y="155" font-family="'JetBrains Mono', monospace" font-size="16" letter-spacing="3"
        text-anchor="middle" fill="#c9d1d9" opacity="0.85">
    CLASS: FULL-STACK &amp; MOBILE DEVELOPER
  </text>

  <!-- XP bar -->
  <g transform="translate(250,180)">
    <rect x="0" y="0" width="400" height="10" rx="5" fill="#111119" stroke="#2a2a3a"/>
    <rect x="0" y="0" width="332" height="10" rx="5" fill="url(#rgbGrad)" filter="url(#glow)"/>
    <text x="400" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8b8b9a" text-anchor="end">XP 8,320 / 10,000 — NEXT: SENIOR TIER</text>
  </g>
</svg>
